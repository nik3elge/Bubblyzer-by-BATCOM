name: Build and Release Bubblyzer by BATCOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub ultralytics onnx

      - name: Download / Verify ONNX model
        run: |
          python export_onnx.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean bubblyzer.spec

      - name: Prepare Windows Distribution Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Bubblyzer-Windows
          Copy-Item dist/Bubblyzer.exe dist/Bubblyzer-Windows/
          Copy-Item affinity_bubblyzer.js dist/Bubblyzer-Windows/
          Copy-Item config.json dist/Bubblyzer-Windows/
          Compress-Archive -Path dist/Bubblyzer-Windows/* -DestinationPath dist/Bubblyzer-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubblyzer-Windows-x64
          path: dist/Bubblyzer-Windows-x64.zip

  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub ultralytics onnx

      - name: Download / Verify ONNX model
        run: |
          python export_onnx.py

      - name: Build with PyInstaller on macOS
        run: |
          pyinstaller --clean \
            --name=Bubblyzer \
            --onedir \
            --windowed \
            --add-data="comic-speech-bubble-detector.onnx:." \
            --add-data="config.json:." \
            --add-data="affinity_bubblyzer.js:." \
            --hidden-import=onnxruntime \
            --hidden-import=pystray \
            --hidden-import=PIL \
            --hidden-import=cv2 \
            --hidden-import=flask \
            main.py

      - name: Prepare macOS Distribution Archive
        run: |
          mkdir -p dist/Bubblyzer-macOS
          cp -R dist/Bubblyzer.app dist/Bubblyzer-macOS/
          cp affinity_bubblyzer.js dist/Bubblyzer-macOS/
          cp config.json dist/Bubblyzer-macOS/
          cd dist && zip -r Bubblyzer-macOS.zip Bubblyzer-macOS

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubblyzer-macOS
          path: dist/Bubblyzer-macOS.zip

  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Bubblyzer-Windows-x64
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Bubblyzer-macOS
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/Bubblyzer-Windows-x64.zip
            ./release-assets/Bubblyzer-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
