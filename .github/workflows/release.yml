name: Build and Release Bubblyzer by BATCOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Export ONNX model (isolated environment)
        shell: pwsh
        run: |
          python -m venv export_venv
          .\export_venv\Scripts\python -m pip install --upgrade pip
          .\export_venv\Scripts\pip install huggingface_hub ultralytics onnx
          .\export_venv\Scripts\python models/export_onnx.py
          Remove-Item -Recurse -Force export_venv

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean bubblyzer.spec

      - name: Prepare Windows Distribution Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Bubblyzer-Windows
          Copy-Item dist/Bubblyzer.exe dist/Bubblyzer-Windows/
          Copy-Item affinity/affinity_bubblyzer.js dist/Bubblyzer-Windows/
          Compress-Archive -Path dist/Bubblyzer-Windows/* -DestinationPath dist/Bubblyzer-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubblyzer-Windows-x64
          path: dist/Bubblyzer-Windows-x64.zip

  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Export ONNX model (isolated environment)
        run: |
          python -m venv export_venv
          export_venv/bin/python -m pip install --upgrade pip
          export_venv/bin/pip install huggingface_hub ultralytics onnx
          export_venv/bin/python models/export_onnx.py
          rm -rf export_venv

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller on macOS
        run: |
          pyinstaller --clean \
            --name=Bubblyzer \
            --onedir \
            --windowed \
            --paths="src" \
            --icon="assets/app_icon.png" \
            --add-data="models/comic-speech-bubble-detector.onnx:models" \
            --add-data="affinity/affinity_bubblyzer.js:affinity" \
            --add-data="assets/*:assets" \
            --exclude-module=torch \
            --exclude-module=torchvision \
            --exclude-module=ultralytics \
            --exclude-module=scipy \
            --exclude-module=matplotlib \
            --exclude-module=pandas \
            --exclude-module=sympy \
            --exclude-module=networkx \
            --exclude-module=tkinter \
            --hidden-import=onnxruntime \
            --hidden-import=pystray \
            --hidden-import=pystray._darwin \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=PIL.ImageDraw \
            --hidden-import=cv2 \
            --hidden-import=flask \
            --hidden-import=werkzeug \
            --hidden-import=jinja2 \
            src/main.py

      - name: Prepare macOS Distribution Archive
        run: |
          mkdir -p dist/Bubblyzer-macOS
          cp -R dist/Bubblyzer.app dist/Bubblyzer-macOS/
          cp affinity/affinity_bubblyzer.js dist/Bubblyzer-macOS/
          cd dist && zip -r Bubblyzer-macOS.zip Bubblyzer-macOS

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubblyzer-macOS
          path: dist/Bubblyzer-macOS.zip

  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Bubblyzer-Windows-x64
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Bubblyzer-macOS
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/Bubblyzer-Windows-x64.zip
            ./release-assets/Bubblyzer-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
